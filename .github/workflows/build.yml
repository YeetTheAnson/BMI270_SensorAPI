name: Build SigmaStar BMI270 Logger
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM Linux Cross-Compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Compile Static Binary
        # Compiling statically ensures it works on OpenIPC regardless of uClibc/musl differences
        run: arm-linux-gnueabihf-gcc *.c -I. -static -O2 -o bmi270_logger

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: bmi270_logger_binary
          path: bmi270_logger
