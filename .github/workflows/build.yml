name: Build actioncam
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM Linux Cross-Compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Fetch Bosch BMI270 SensorAPI
        run: git clone --depth 1 https://github.com/boschsensortec/BMI270_SensorAPI bmi270_api

      - name: Compile static binary
        # Only the three files we need: Bosch's bmi2.c + bmi270.c and our actioncam.c.
        # (Do NOT use *.c: the Bosch repo has several chip variants that clash.)
        run: |
          arm-linux-gnueabihf-gcc -O2 -static -Wall \
            -Ibmi270_api \
            actioncam.c bmi270_api/bmi2.c bmi270_api/bmi270.c \
            -lpthread -lrt -o actioncam

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: actioncam_binary
          path: actioncam
